# ============================================================
# Mosquitto broker local cho Bai thuc hanh so 2
#  - Listener 1883 cho collector.py / simulator.py
#  - Bridge keo du lieu ESP32 (Wokwi) tu public broker ve may
# ============================================================
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Listener cho client trong may / LAN (demo: cho phep anonymous)
listener 1883
allow_anonymous true

# Giu toi da 10000 message QoS1 cho moi client co persistent session
# (collector tat tam thoi van khong mat du lieu)
max_queued_messages 10000

# ------------------------------------------------------------
# BRIDGE: broker.emqx.io  <-->  Mosquitto local
# ESP32 publish:   dungdinh60240505/iot/sensor/room1
# Local nhan duoc:                  iot/sensor/room1
# Doi "dungdinh60240505/" cho trung TOPIC_NAMESPACE trong firmware.
# ------------------------------------------------------------
connection public-emqx
address broker.emqx.io:1883
# clientid phai duy nhat tren public broker -> doi theo ten cua ban
remote_clientid bridge-dungdinh60240505-lab2
cleansession true
try_private false
bridge_protocol_version mqttv311
keepalive_interval 30
restart_timeout 5 30
start_type automatic
notifications false
# topic <pattern> <huong> <qos> <local-prefix> <remote-prefix>
topic iot/# in 1 "" dungdinh60240505/
